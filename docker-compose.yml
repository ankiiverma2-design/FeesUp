# Local Postgres for FeesUp development.
# Usage: `docker compose up -d`  (matches backend/.env.example DATABASE_URL)
services:
  postgres:
    image: postgres:16
    container_name: feesup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feesup
    ports:
      - '5432:5432'
    volumes:
      - feesup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d feesup']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  feesup_pgdata:
