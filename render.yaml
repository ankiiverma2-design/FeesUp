# Render Blueprint for the FeesUp API.
# This file MUST live at the repository ROOT for Render's Blueprint feature to find it.
# The service builds from the /backend subdirectory (rootDir: backend).
# Deploy: on Render, "New +" > "Blueprint", pick this repo, fill the sync:false vars.
# Scheduled jobs (fee generation + reminders) run via the free GitHub Actions cron
# (.github/workflows/scheduled-jobs.yml) hitting /internal/jobs/* — see docs/Architecture.md.
services:
  - type: web
    name: feesup-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    # Syncs the schema to the database (creates/updates tables), then starts the server.
    # Uses `db push` because no migration history is committed yet; switch to
    # `prisma migrate deploy` once you generate migrations (see docs/DEPLOYMENT.md).
    startCommand: npx prisma db push --skip-generate && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set to your Supabase connection string (Session pooler)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false # set to your Lovable URL, e.g. https://your-app.lovableproject.com (or * to start)
      - key: INTERNAL_JOB_SECRET
        sync: false # any long random string; reused by the scheduled-jobs workflow
      - key: PAYMENT_PROVIDER
        value: mock # switch to "razorpay" when keys are set
      - key: MESSAGING_PROVIDER
        value: mock # switch to "payperwa" when keys are set
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYPERWA_API_KEY
        sync: false
      - key: PAYPERWA_BASE_URL
        sync: false
